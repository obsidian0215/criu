name: Page-server identity regression

on:
  push:
    branches:
      - 'validation/remote-parent-submit-*'
  workflow_dispatch:

jobs:
  identity:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build test container
        run: |
          if [ '${{ matrix.compiler }}' = clang ]; then
            sudo make -C scripts/build alpine-clang
          else
            sudo make -C scripts/build alpine
          fi
      - name: Reproduce baseline failures and verify fixes
        run: |
          sudo docker run --rm --privileged --userns=host --cgroupns=host \
            -v "$PWD:/criu" --tmpfs /run \
            -e CC='${{ matrix.compiler }}' -e HOSTCC='${{ matrix.compiler }}' \
            criu-alpine sh test/others/page-server-identity/check-ci.sh
      - name: Collect readable failure logs
        if: always()
        run: |
          sudo find test/others/page-server-identity -name '*.log' -type f \
            -print -exec tail -n 60 {} \;
          sudo chown -R "$(id -u):$(id -g)" test/others/page-server-identity
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: identity-${{ matrix.compiler }}-${{ github.run_id }}
          path: |
            test/others/page-server-identity/work/
            test/others/page-server-identity/baseline-*/
            test/others/page-server-identity/with-lz4/
            test/others/page-server-identity/*.log
