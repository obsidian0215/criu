name: Remote parent candidate validation

on:
  push:
    branches:
      - 'exp/remote-parent-route-2r-candidate-test-*'
  workflow_dispatch:

jobs:
  validate:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Static checks
        run: |
          set -euxo pipefail
          for script in test/others/remote-parent-experiment/*.sh; do
            bash -n "$script"
          done
          python3 -m py_compile test/others/remote-parent-experiment/*.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/ci/run-ci-tests.sh')
          s = p.read_text()
          marker = '# Unit tests at this point do not require any kernel or hardware capabilities.\n'
          hook = 'if [ -n "${REMOTE_PARENT_EXPERIMENT:-}" ]; then\\n\\ttime make -C test/others/remote-parent-experiment check\\n\\texit 0\\nfi\\n\\n'
          if s.count(marker) != 1:
              raise SystemExit('unable to locate unique unit-test marker')
          if hook not in s:
              s = s.replace(marker, hook + marker, 1)
          if s.count(hook) != 1:
              raise SystemExit('unable to install unique experiment hook')
          p.write_text(s)
          PY
          git diff --check
      - name: Run targeted validation
        run: |
          set -euxo pipefail
          printf '\nREMOTE_PARENT_EXPERIMENT=1\n' >> scripts/ci/docker.env
          if [ '${{ matrix.compiler }}' = clang ]; then
            sudo -E make -C scripts/ci alpine CLANG=1 ZDTM_SHARD_INDEX=4 ZDTM_SHARD_COUNT=4
          else
            sudo -E make -C scripts/ci alpine GCC=1 ZDTM_SHARD_INDEX=4 ZDTM_SHARD_COUNT=4
          fi
      - name: Print diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          root="$GITHUB_WORKSPACE/test/others/remote-parent-experiment"
          sudo find "$root/results" -maxdepth 4 -type f -print -exec sh -c '
            for file do
              echo "===== $file ====="
              cat "$file"
            done
          ' sh {} + 2>/dev/null || true
          sudo find "$root" -maxdepth 6 -type f \
            \( -path '*work*' -o -path '*/results/*' \) \
            \( -name '*.log' -o -name '*.out' -o -name '*.state' -o -name '*.json' -o -name '*.tsv' \) \
            -print0 2>/dev/null |
            while IFS= read -r -d '' file; do
              echo "===== $file ====="
              sudo tail -n 300 "$file" || true
            done
      - name: Package diagnostics
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          root="$GITHUB_WORKSPACE/test/others/remote-parent-experiment"
          archive="$RUNNER_TEMP/remote-parent-candidate-${{ matrix.compiler }}-${{ github.run_id }}.tar.gz"
          cd "$root"
          mapfile -d '' paths < <(find . -maxdepth 1 -type d \( -name 'results' -o -name '*work*' \) -print0)
          if ((${#paths[@]})); then
            sudo find "${paths[@]}" \( -type f -o -type l \) -print0 |
              sudo tar --null -czf "$archive" --files-from=-
          else
            tar -czf "$archive" --files-from=/dev/null
          fi
          sudo chown "$(id -u):$(id -g)" "$archive"
          chmod a+r "$archive"
          printf 'DIAGNOSTIC_ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-parent-candidate-${{ matrix.compiler }}-${{ github.run_id }}
          path: ${{ env.DIAGNOSTIC_ARCHIVE }}
          if-no-files-found: error
