name: Remote parent experiment

on:
  push:
    branches:
      - 'exp/remote-parent-route-*'
  workflow_dispatch:

jobs:
  validate:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Apply route implementation and strict test fixes
        run: |
          set -euxo pipefail
          patch=experiments/remote-parent/route.patch
          test -s "$patch"
          git apply --check "$patch"
          git apply "$patch"
          python3 - <<'PY'
          from pathlib import Path

          ci_path = Path('scripts/ci/run-ci-tests.sh')
          ci_text = ci_path.read_text()
          marker = '# Unit tests at this point do not require any kernel or hardware capabilities.\n'
          early = '''if [ -n "${REMOTE_PARENT_EXPERIMENT:-}" ]; then
          \ttime make -C test/others/remote-parent-experiment check
          \texit 0
          fi

          '''
          ci_text = ci_text.replace(early, '')
          if ci_text.count(marker) != 1:
              raise SystemExit('unable to locate unique unit-test marker')
          ci_text = ci_text.replace(marker, early + marker, 1)
          if ci_text.count(early) != 1:
              raise SystemExit('unable to install unique experiment entry point')
          ci_path.write_text(ci_text)

          regression_path = Path('test/others/remote-parent-experiment/regression.sh')
          regression_text = regression_path.read_text()
          old = '''PRE1_PAYLOAD=$(sum_glob_bytes "$TARGET_PRE1" 'pages-*.img')
          [ "$PRE1_PAYLOAD" -gt $((8 * 1024 * 1024)) ] || fail "first pre-dump payload is too small"
          '''
          new = '''PRE1_PAYLOAD=$(sum_glob_bytes "$TARGET_PRE1" 'pages-*.img')
          if [ "$COMPRESSION" = plain ]; then
          \t[ "$PRE1_PAYLOAD" -gt $((8 * 1024 * 1024)) ] || fail "first pre-dump payload is too small"
          else
          \t[ "$PRE1_PAYLOAD" -gt 0 ] || fail "first compressed pre-dump has no payload"
          \tgrep -q "page-xfer: Adding compressed" "$TARGET_PRE1/page-server.log" ||
          \t\tfail "first pre-dump did not record compressed page ranges"
          fi
          '''
          if regression_text.count(old) != 1:
              raise SystemExit('unable to locate unique first-payload assertion')
          regression_text = regression_text.replace(old, new, 1)
          if regression_text.count(new) != 1:
              raise SystemExit('unable to install compression-aware first-payload assertion')
          regression_path.write_text(regression_text)
          PY
          bash -n test/others/remote-parent-experiment/regression.sh
          git diff --check
      - name: Run targeted validation
        run: |
          set -euxo pipefail
          printf '\nREMOTE_PARENT_EXPERIMENT=1\n' >> scripts/ci/docker.env
          if [ '${{ matrix.compiler }}' = clang ]; then
            sudo -E make -C scripts/ci alpine CLANG=1 ZDTM_SHARD_INDEX=4 ZDTM_SHARD_COUNT=4
          else
            sudo -E make -C scripts/ci alpine GCC=1 ZDTM_SHARD_INDEX=4 ZDTM_SHARD_COUNT=4
          fi
      - name: Upload experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-parent-${{ matrix.compiler }}-${{ github.run_id }}
          path: test/others/remote-parent-experiment/results
          if-no-files-found: warn
