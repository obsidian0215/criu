name: Remote parent experiment

on:
  push:
    branches:
      - 'validation/remote-parent-route2h-v1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Apply Route 2H product changes
        run: |
          set -euxo pipefail
          python3 experiments/remote-parent/apply-route2h.py "$GITHUB_WORKSPACE"
      - name: Validate experiment sources
        run: |
          set -euxo pipefail
          python3 -m py_compile experiments/remote-parent/apply-route2h.py
          for script in test/others/remote-parent-experiment/*.sh; do
            bash -n "$script"
          done
          python3 -m py_compile test/others/remote-parent-experiment/*.py
          git diff --check
      - name: Run targeted validation
        run: |
          set -euxo pipefail
          printf '\nREMOTE_PARENT_EXPERIMENT=1\n' >> scripts/ci/docker.env
          if [ '${{ matrix.compiler }}' = clang ]; then
            sudo -E make -C scripts/ci alpine CLANG=1 ZDTM_SHARD_INDEX=4 ZDTM_SHARD_COUNT=4
          else
            sudo -E make -C scripts/ci alpine GCC=1 ZDTM_SHARD_INDEX=4 ZDTM_SHARD_COUNT=4
          fi
      - name: Print failure diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          root="$GITHUB_WORKSPACE/test/others/remote-parent-experiment"
          echo '===== result summaries ====='
          sudo find "$root/results" -maxdepth 3 -type f -print -exec sh -c '
            for file do
              echo "===== $file ====="
              cat "$file"
            done
          ' sh {} + 2>/dev/null || true
          echo '===== lifecycle shm tree ====='
          sudo find "$root" -path '*/lifecycle-work-*/shm/*' \
            -printf '%M %u:%g %s %p -> %l\n' 2>/dev/null | sort || true
          echo '===== lifecycle shm logs ====='
          sudo find "$root" -path '*/lifecycle-work-*/shm/*' -type f \
            \( -name '*.log' -o -name '*.out' -o -name '*.txt' \) -print0 2>/dev/null |
            while IFS= read -r -d '' file; do
              echo "===== $file ====="
              sudo tail -n 500 "$file" || true
            done
          echo '===== parentless boundary logs ====='
          sudo find "$root" -path '*/boundary-work-*/*' -type f \
            \( -name '*.log' -o -name '*.state' -o -name '*.json' \) -print0 2>/dev/null |
            while IFS= read -r -d '' file; do
              echo "===== $file ====="
              sudo tail -n 500 "$file" || true
            done
          echo '===== parent contract logs ====='
          sudo find "$root" -path '*/contract-work-*/*' -type f \
            \( -name '*.log' -o -name '*.state' -o -name '*.json' -o -name '*.hex' \) -print0 2>/dev/null |
            while IFS= read -r -d '' file; do
              echo "===== $file ====="
              sudo tail -n 500 "$file" || true
            done
          echo '===== pid reuse logs ====='
          sudo find "$root" -path '*/pid-reuse-work-*/*' -type f \
            \( -name '*.log' -o -name '*.state' -o -name '*.json' -o -name '*.hex' \) -print0 2>/dev/null |
            while IFS= read -r -d '' file; do
              echo "===== $file ====="
              sudo tail -n 500 "$file" || true
            done
      - name: Package experiment diagnostics
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          root="$GITHUB_WORKSPACE/test/others/remote-parent-experiment"
          archive="$RUNNER_TEMP/remote-parent-${{ matrix.compiler }}-${{ github.run_id }}.tar.gz"
          cd "$root"
          shopt -s nullglob
          paths=(results fault-work-* lifecycle-work-* boundary-work-* contract-work-* pid-reuse-work-* relocation-work-*)
          if ((${#paths[@]})); then
            sudo find "${paths[@]}" \( -type f -o -type l \) -print0 |
              sudo tar --null -czf "$archive" --files-from=-
          else
            tar -czf "$archive" --files-from=/dev/null
          fi
          sudo chown "$(id -u):$(id -g)" "$archive"
          chmod a+r "$archive"
          test -r "$archive"
          printf 'DIAGNOSTIC_ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"
      - name: Upload experiment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-parent-${{ matrix.compiler }}-${{ github.run_id }}
          path: ${{ env.DIAGNOSTIC_ARCHIVE }}
          if-no-files-found: error

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      BASE_BRANCH: feature/remote-parent-page-server-route1-clean
      TARGET_BRANCH: feature/remote-parent-page-server-route2h-v1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish clean Route 2H candidate
        shell: bash
        run: |
          set -euxo pipefail
          transform="$RUNNER_TEMP/apply-route2h.py"
          cp experiments/remote-parent/apply-route2h.py "$transform"
          git fetch origin "refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          git checkout --detach "refs/remotes/origin/$BASE_BRANCH"
          python3 "$transform" "$GITHUB_WORKSPACE"
          git diff --check
          git status --short
          git add \
            images/pagemap.proto \
            criu/include/image.h \
            criu/include/pagemap.h \
            criu/image.c \
            criu/page-xfer.c \
            criu/pagemap.c
          git diff --cached --quiet && {
            echo 'Route 2H transformation produced no changes' >&2
            exit 1
          }
          git config user.name 'YIFAN LU'
          git config user.email 'luyifan20@mails.ucas.edu.cn'
          git commit -m 'pagemap: bind inherited pages to parent generation' \
            -m 'Record the destination parent generation in page-server-created pagemaps and verify it against the parent that restore actually opens. Self-contained fallback images remain unbound because they contain no inherited ranges.' \
            -m 'Signed-off-by: YIFAN LU <luyifan20@mails.ucas.edu.cn>'
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null; then
            git fetch origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
            expected=$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")
            git push --force-with-lease="refs/heads/$TARGET_BRANCH:$expected" \
              origin "HEAD:refs/heads/$TARGET_BRANCH"
          else
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
